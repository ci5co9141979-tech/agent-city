name: agent-city-weekly
on:
  schedule: [{cron: "0 13 * * 1"}]   # every Monday 13:00 UTC = 8am US Central (CDT)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice-calc fonts-inter
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Build this week's product (Muse picks it, the team builds it)
        run: python run.py --weekly
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - name: Update the city UI (live numbers from state/launched.json)
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib
          try:
              d = json.loads(pathlib.Path("state/launched.json").read_text(encoding="utf-8"))
          except Exception:
              d = {}
          entries = d.get("entries") or {}
          hist = d.get("history") or []
          shipped = len(entries)
          last = hist[-1] if hist else {}
          key = last.get("key")
          name = (entries.get(key) or {}).get("name", "")
          cmd = ["python3", "city-ui/scripts/sync_state.py"]
          if shipped:
              cmd += ["--shipped", str(shipped)]
          if name:
              cmd += ["--product", name]
          subprocess.run(cmd, check=False)
          at = last.get("date")
          if at:
              for f in ("city-ui/state.js", "city-ui/state.json"):
                  p = pathlib.Path(f)
                  if p.is_file():
                      p.write_text(p.read_text(encoding="utf-8").replace('"at": null', '"at": ' + json.dumps(at), 1), encoding="utf-8")
          PY
      - name: Remember what was launched
        run: |
          git config user.name "agent-city"; git config user.email "agent-city@users.noreply.github.com"
          git add state/launched.json city-ui/ && git commit -m "weekly product launched" || true
          git push || true
      - uses: actions/upload-artifact@v4
        with: {name: weekly-launch-kit, path: "out/", retention-days: 90}
